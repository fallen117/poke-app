<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex — Todos los Pokémon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <header>
    <div class="logo">Poké<span>dex</span></div>
    <p class="subtitle" id="subtitle">Cargando lista completa...</p>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="search" placeholder="Buscar Pokémon..." oninput="onSearch()">
    </div>
  </div>

  <div class="gen-filters" id="gen-filters"></div>
  <div class="filters" id="type-filters"></div>

  <div class="stats-bar">
    <span id="result-count"></span>
    <div class="pagination">
      <button class="page-btn" id="prev-btn" onclick="goToPage(currentPage - 1)">← Anterior</button>
      <span class="page-info" id="page-info"></span>
      <button class="page-btn" id="next-btn" onclick="goToPage(currentPage + 1)">Siguiente →</button>
      <div class="range-wrap">
        <input type="range" id="page-range" min="1" max="1" value="1" oninput="onRangeChange(this.value)">
        <span class="range-label" id="range-label">1 / 1</span>
      </div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-top">
      <div>
        <div class="modal-num" id="m-num"></div>
        <div class="modal-name" id="m-name"></div>
        <div class="modal-types" id="m-types"></div>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-img"><img id="m-img" src="" alt=""></div>
    <div class="modal-body">
      <div class="info-grid">
        <div class="info-tile"><div class="label">Altura</div><div class="value" id="m-height"></div></div>
        <div class="info-tile"><div class="label">Peso</div><div class="value" id="m-weight"></div></div>
        <div class="info-tile"><div class="label">Exp. base</div><div class="value" id="m-exp"></div></div>
        <div class="info-tile"><div class="label">Número</div><div class="value" id="m-id"></div></div>
      </div>
      <div class="section-title">Estadísticas base</div>
      <div id="m-stats"></div>
      <div class="section-title" style="margin-top:1rem">Habilidades</div>
      <div class="ability-list" id="m-abilities"></div>
    </div>
  </div>
</div>

<script>
  const TYPE_COLORS = {
    fire:     { bg: '#3a1a12', badge: '#ff6b35', text: '#ffb49a' },
    water:    { bg: '#0d1f3a', badge: '#3a8fe8', text: '#93c5fd' },
    grass:    { bg: '#0f2a14', badge: '#4caf50', text: '#86efac' },
    poison:   { bg: '#2a0f2e', badge: '#9c27b0', text: '#d8b4fe' },
    flying:   { bg: '#0f1f2e', badge: '#29b6f6', text: '#bae6fd' },
    bug:      { bg: '#1a2a0a', badge: '#8bc34a', text: '#bef264' },
    normal:   { bg: '#1e1e24', badge: '#757575', text: '#d1d5db' },
    electric: { bg: '#2e2500', badge: '#fdd835', text: '#fef08a' },
    ground:   { bg: '#2a1a06', badge: '#c8a04a', text: '#fde68a' },
    fairy:    { bg: '#2e0f1e', badge: '#f06292', text: '#fbcfe8' },
    psychic:  { bg: '#2e0f20', badge: '#e91e63', text: '#fda4af' },
    rock:     { bg: '#1a1510', badge: '#8d6e63', text: '#d6b99c' },
    ice:      { bg: '#0a1e2a', badge: '#4dd0e1', text: '#a5f3fc' },
    dragon:   { bg: '#0d0d2e', badge: '#5c6bc0', text: '#c7d2fe' },
    ghost:    { bg: '#150d2e', badge: '#7e57c2', text: '#ddd6fe' },
    fighting: { bg: '#2e0a0a', badge: '#e53935', text: '#fca5a5' },
    steel:    { bg: '#181820', badge: '#90a4ae', text: '#e2e8f0' },
    dark:     { bg: '#100f14', badge: '#455a64', text: '#94a3b8' },
  };

  const STAT_NAMES = {
    'hp': 'HP', 'attack': 'Ataque', 'defense': 'Defensa',
    'special-attack': 'Sp. Atq', 'special-defense': 'Sp. Def', 'speed': 'Velocidad'
  };

  const STAT_COLORS = ['#e63946','#f4a261','#e9c46a','#2a9d8f','#457b9d','#a8dadc'];

  const GENERATIONS = [
    { label: 'Todos',   gen: 'all', start: 0,    end: Infinity },
    { label: 'Gen I',   gen: 'i',   start: 1,    end: 151 },
    { label: 'Gen II',  gen: 'ii',  start: 152,  end: 251 },
    { label: 'Gen III', gen: 'iii', start: 252,  end: 386 },
    { label: 'Gen IV',  gen: 'iv',  start: 387,  end: 493 },
    { label: 'Gen V',   gen: 'v',   start: 494,  end: 649 },
    { label: 'Gen VI',  gen: 'vi',  start: 650,  end: 721 },
    { label: 'Gen VII', gen: 'vii', start: 722,  end: 809 },
    { label: 'Gen VIII',gen: 'viii',start: 810,  end: 905 },
    { label: 'Gen IX',  gen: 'ix',  start: 906,  end: 1025 },
    { label: 'Gen X',   gen: 'x',   start: 10001, end: Infinity },
  ];

  const PAGE_SIZE = 20;
  let allPokemon = [];
  let detailsCache = {};
  let currentPage = 1;
  let activeType = 'all';
  let activeGen = 'all';
  let totalPages = 1;
  let knownTypes = new Set();
  let isLoadingRecursive = false;

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('search');
  const overlay = document.getElementById('overlay');

  function showSkeletons(n) {
    grid.innerHTML = Array(n).fill('<div class="skeleton"></div>').join('');
  }

  async function init() {
    showSkeletons(PAGE_SIZE);
    document.getElementById('subtitle').textContent = 'Cargando lista de Pokémon...';

    const res = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1350&offset=0');
    const data = await res.json();
    allPokemon = data.results.map(p => ({
      name: p.name,
      url: p.url,
      id: parseInt(p.url.split('/').filter(Boolean).pop()),
    }));
    const count = allPokemon.length;
    document.getElementById('subtitle').textContent = `${count} Pokémon en total`;

    buildGenFilters();
    await loadDetails(allPokemon.slice(0, PAGE_SIZE));
    buildTypeFilters();
    apply();
  }

  function buildGenFilters() {
    const container = document.getElementById('gen-filters');
    container.innerHTML = GENERATIONS.map(g =>
      `<button class="gen-btn ${g.gen === 'all' ? 'active' : ''}" data-gen="${g.gen}" onclick="setGen('${g.gen}')">${g.label}</button>`
    ).join('');
  }

  function buildTypeFilters() {
    const sorted = ['all', ...Array.from(knownTypes).sort()];
    document.getElementById('type-filters').innerHTML = sorted.map(t =>
      `<button class="filter-btn ${t === 'all' ? 'active' : ''}" data-type="${t}" onclick="setType('${t}')">${t === 'all' ? 'Tipos' : t}</button>`
    ).join('');
    document.getElementById('type-filters').style.display = knownTypes.size > 0 ? 'flex' : 'none';
  }

  function collectTypes() {
    Object.values(detailsCache).forEach(d => {
      if (d && d.types) d.types.forEach(t => knownTypes.add(t.type.name));
    });
  }

  function setGen(gen) {
    activeGen = gen;
    currentPage = 1;
    document.querySelectorAll('.gen-btn').forEach(b => b.classList.toggle('active', b.dataset.gen === gen));
    apply();
  }

  function setType(t) {
    activeType = t;
    currentPage = 1;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.type === t));
    apply();
  }

  function onSearch() {
    currentPage = 1;
    apply();
  }

  function getFiltered() {
    const q = searchInput.value.toLowerCase().trim();
    const gen = GENERATIONS.find(g => g.gen === activeGen);
    let list = allPokemon;

    if (gen && gen.gen !== 'all') {
      list = list.filter(p => p.id >= gen.start && p.id <= gen.end);
    }

    if (q) {
      list = list.filter(p => p.name.includes(q) || String(p.id).includes(q));
    }

    if (activeType !== 'all') {
      list = list.filter(p => {
        const cached = detailsCache[p.id];
        if (cached && cached.types) {
          return cached.types.some(t => t.type.name === activeType);
        }
        return true;
      });
    }

    return list;
  }

  async function ensureTypeData(list) {
    const needed = list.filter(p => {
      const cached = detailsCache[p.id];
      return !(cached && cached.types);
    });
    if (needed.length > 0) {
      await loadDetails(needed);
      collectTypes();
      buildTypeFilters();
    }
  }

  async function apply() {
    if (isLoadingRecursive) return;
    let filtered = getFiltered();

    if (activeType !== 'all') {
      const unfilterable = filtered.filter(p => {
        const cached = detailsCache[p.id];
        return !(cached && cached.types);
      });
      if (unfilterable.length > 0) {
        isLoadingRecursive = true;
        await loadDetails(unfilterable);
        collectTypes();
        buildTypeFilters();
        isLoadingRecursive = false;
        filtered = getFiltered();
      }
    }

    const total = filtered.length;
    totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageItems = filtered.slice(start, start + PAGE_SIZE);

    document.getElementById('result-count').innerHTML =
      `<strong>${total}</strong> Pokémon encontrados`;

    document.getElementById('page-info').textContent =
      `Página ${currentPage} de ${totalPages}`;

    document.getElementById('prev-btn').disabled = currentPage <= 1;
    document.getElementById('next-btn').disabled = currentPage >= totalPages;

    const rangeInput = document.getElementById('page-range');
    rangeInput.max = totalPages;
    rangeInput.value = currentPage;
    document.getElementById('range-label').textContent = `${currentPage} / ${totalPages}`;

    if (pageItems.length === 0) {
      grid.innerHTML = '<div class="empty">Sin resultados para esa búsqueda</div>';
      return;
    }

    showSkeletons(pageItems.length);
    await loadDetails(pageItems);
    collectTypes();
    render(pageItems);
  }

  async function loadDetails(items) {
    const uncached = items.filter(p => !detailsCache[p.id]);
    if (uncached.length === 0) return;

    const chunks = [];
    for (let i = 0; i < uncached.length; i += 10) {
      chunks.push(uncached.slice(i, i + 10));
    }

    for (const chunk of chunks) {
      const results = await Promise.all(
        chunk.map(p =>
          fetch(p.url).then(r => r.json()).catch(() => null)
        )
      );
      results.forEach((data) => {
        if (data) detailsCache[data.id] = data;
      });
    }
  }

  function render(items) {
    if (items.length === 0) {
      grid.innerHTML = '<div class="empty">Sin resultados</div>';
      return;
    }

    grid.innerHTML = items.map(p => {
      const data = detailsCache[p.id];
      if (!data) return '';

      const mainType = data.types[0].type.name;
      const c = TYPE_COLORS[mainType] || TYPE_COLORS.normal;
      const sprite = data.sprites.other['official-artwork'].front_default || data.sprites.front_default;
      const badges = data.types.map(t => {
        const tc = TYPE_COLORS[t.type.name] || TYPE_COLORS.normal;
        return `<span class="badge" style="background:${tc.bg};color:${tc.text}">${t.type.name}</span>`;
      }).join('');

      return `
        <div class="card" onclick="openModal(${data.id})" style="--card-glow:${c.badge}">
          <div class="card-num">#${String(data.id).padStart(3,'0')}</div>
          <img src="${sprite}" alt="${data.name}" loading="lazy">
          <div class="card-name">${data.name}</div>
          <div class="types">${badges}</div>
        </div>`;
    }).join('');
  }

  function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    apply();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function onRangeChange(val) {
    const page = parseInt(val, 10);
    if (page !== currentPage) {
      currentPage = page;
      apply();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      document.getElementById('range-label').textContent = `${page} / ${totalPages}`;
    }
  }

  function openModal(id) {
    const data = detailsCache[id];
    if (!data) return;

    const sprite = data.sprites.other['official-artwork'].front_default || data.sprites.front_default;

    document.getElementById('m-num').textContent = '#' + String(data.id).padStart(3, '0');
    document.getElementById('m-name').textContent = data.name;
    document.getElementById('m-img').src = sprite;
    document.getElementById('m-img').alt = data.name;
    document.getElementById('m-height').textContent = (data.height / 10).toFixed(1) + ' m';
    document.getElementById('m-weight').textContent = (data.weight / 10).toFixed(1) + ' kg';
    document.getElementById('m-exp').textContent = data.base_experience ?? '—';
    document.getElementById('m-id').textContent = data.id;

    document.getElementById('m-types').innerHTML = data.types.map(t => {
      const tc = TYPE_COLORS[t.type.name] || TYPE_COLORS.normal;
      return `<span class="badge" style="background:${tc.bg};color:${tc.text}">${t.type.name}</span>`;
    }).join('');

    document.getElementById('m-stats').innerHTML = data.stats.map((s, i) => {
      const pct = Math.round((s.base_stat / 255) * 100);
      const color = STAT_COLORS[i % STAT_COLORS.length];
      return `<div class="stat-row">
        <div class="stat-name">${STAT_NAMES[s.stat.name] || s.stat.name}</div>
        <div class="stat-track"><div class="stat-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="stat-val">${s.base_stat}</div>
      </div>`;
    }).join('');

    document.getElementById('m-abilities').innerHTML = data.abilities.map(a =>
      `<span class="ability-tag">${a.ability.name}</span>`
    ).join('');

    overlay.classList.add('open');
  }

  function closeModal() {
    overlay.classList.remove('open');
  }

  function handleOverlayClick(e) {
    if (e.target.id === 'overlay') closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  init();
</script>
</body>
</html>
